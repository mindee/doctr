name: tests

on:
  push:
    branches: main
  pull_request:
    branches: main

# Cancel superseded runs when new commits are pushed to a PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest-common:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python }}
          extras: viz,html,testing
      - name: Install parallel test tools
        run: pip install pytest-cov pytest-xdist --upgrade
      # -n auto: parallelize across the runner's 4 cores.
      # --dist loadfile: keep all tests of one file on the same worker, which
      #   avoids most concurrent downloads of the same pretrained model/sample.
      #   If flaky failures from concurrent cache writes appear, drop these two
      #   flags to return to sequential execution.
      # --cov reads [tool.coverage.run] from pyproject.toml (source = doctr)
      #   and, unlike plain `coverage run`, collects coverage from xdist workers.
      - name: Run unittests
        run: pytest tests/common/ -rs -n auto --dist loadfile --cov --cov-report=xml:coverage-common.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-common
          path: ./coverage-common.xml
          if-no-files-found: error

  pytest-torch:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python }}
          extras: viz,html,testing
      - name: Install parallel test tools
        run: pip install pytest-cov pytest-xdist --upgrade
      - name: Run unittests
        run: pytest tests/pytorch/ -rs -n auto --dist loadfile --cov --cov-report=xml:coverage-pt.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-pytorch
          path: ./coverage-pt.xml
          if-no-files-found: error

  codecov-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ pytest-common, pytest-torch ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
